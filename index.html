<!--
  Cursor Trail Contact — secțiune de contact pentru Ansodi Serv SRL
  (versiune într-un singur fișier: HTML + CSS + JS)
  ------------------------------------------------------------------
  Cum se integrează în site-ul existent:

  1. Copiază <link>-urile de fonturi din <head> de mai jos în <head>-ul
     paginii tale (index.html).
  2. Copiază tot blocul <style> de mai jos în <head>, sau lipește-l în
     fișierul tău CSS existent.
  3. Copiază tot ce e între <!-- SECTION START -- > și <!-- SECTION END -- >
     (markup + <script type="module">) chiar înainte de </body>, ca ultima
     secțiune a paginii.

  Site-ul e static (fără bundler), așa că pachetul "shaders" e încărcat
  direct din CDN prin ESM — nu e nevoie de npm install / Vite.

  De completat înainte de deploy (marcate mai jos cu TODO):
  - linkul de contact real (tel:, mailto: sau pagina de contact)
  - profilurile reale de Facebook / Instagram
-->

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Ansodi Serv</title>

<!-- Fonturi -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap">

<style>
  .ctc {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow: hidden;
    background: #070708;
    color: #fff;
    font-family: 'Satoshi', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Shader de fundal — trail-ul de puncte e tot punctul secțiunii */
  .ctc__shader-wrap {
    position: absolute;
    inset: 0;
  }

  .ctc__canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Invitație de contact */
  .ctc__invite {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    text-align: center;
  }

  .ctc__invite h2 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
  }

  @media (min-width: 640px) {
    .ctc__invite h2 {
      font-size: 1.875rem;
    }
  }

  .ctc__cta {
    display: inline-block;
    margin-top: 1.25rem;
    max-width: 100%;
    overflow-wrap: break-word;
    font-size: clamp(2.2rem, 7vw, 6rem);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .ctc__cta:hover {
    color: rgba(255, 255, 255, 0.85);
  }

  .ctc__underline {
    display: block;
    margin: 0.5rem auto 0;
    height: 3px;
    width: 0;
    background: rgba(255, 255, 255, 0.7);
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ctc__cta:hover .ctc__underline {
    width: 100%;
  }

  /* Footer */
  .ctc__footer {
    position: relative;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0 1.5rem 2.25rem;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }

  @media (min-width: 640px) {
    .ctc__footer {
      padding: 0 3rem 2.25rem;
    }
  }

  .ctc__socials {
    display: flex;
    gap: 1.75rem;
  }

  .ctc__socials a {
    color: inherit;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .ctc__socials a:hover {
    color: #fff;
  }

  .ctc__hint {
    margin: 0;
    display: none;
  }

  @media (min-width: 640px) {
    .ctc__hint {
      display: block;
    }
  }

  /* Reveal la încărcare */
  .reveal {
    animation: ctc-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: var(--reveal-delay, 0s);
    opacity: 0;
    transform: translateY(14px);
  }

  @keyframes ctc-reveal {
    to {
      opacity: 1;
      transform: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>

<!-- SECTION START -->
<main class="ctc">

  <div class="ctc__shader-wrap" aria-hidden="true">
    <canvas id="ctc-canvas" class="ctc__canvas"></canvas>
  </div>

  <section class="ctc__invite">
    <h2 class="reveal" style="--reveal-delay: 0.1s">Ai nevoie de o programare?</h2>
    <!-- TODO: înlocuiește href cu tel:, mailto: sau ruta paginii de contact -->
    <a href="#" class="ctc__cta reveal" style="--reveal-delay: 0.25s">
      Contactează-ne
      <span class="ctc__underline"></span>
    </a>
  </section>

  <footer class="ctc__footer reveal" style="--reveal-delay: 0.45s">
    <div class="ctc__socials">
      <!-- TODO: înlocuiește cu profilurile reale -->
      <a href="#" target="_blank" rel="noopener">Facebook</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
    </div>
    <p class="ctc__hint">( mișcă cursorul )</p>
  </footer>

</main>

<script type="module">
  /*
    Arborele de componente (ordinea contează) e cel din specificația
    secțiunii: două componente invizibile (ChromaFlow + DotGrid) generează
    câmpul de urmărire a cursorului, iar al doilea LinearGradient e mascat
    cu acel câmp ca să deseneze trail-ul alb pe puncte. Nu redenumi id-urile
    fără să actualizezi ambele capete ale legăturii (dotSize.source și
    maskSource) — și păstrează ambele componente invizibile în arbore,
    chiar dacă `visible: false`, altfel efectul dispare complet.
  */
  const canvas = document.getElementById('ctc-canvas');
  let shader = null;

  // Emblemă de stare, vizibilă direct pe pagină — ca să nu mai fie nevoie de
  // F12 ca să vezi ce se întâmplă. Poți șterge tot blocul ăsta (badge +
  // apelurile setStatus) odată ce efectul merge stabil.
  const badge = document.createElement('div');
  badge.style.cssText = `
    position: fixed; left: 12px; bottom: 12px; z-index: 9999;
    max-width: min(90vw, 520px);
    background: rgba(0,0,0,0.85); color: #0f0;
    font: 12px/1.4 ui-monospace, monospace;
    padding: 8px 10px; border-radius: 6px;
    white-space: pre-wrap; word-break: break-word;
  `;
  badge.textContent = 'Efect: se încarcă…';
  document.body.appendChild(badge);
  function setStatus(text, ok) {
    badge.textContent = 'Efect: ' + text;
    badge.style.color = ok ? '#7CFC7C' : '#FF6B6B';
  }

  async function initShader() {
    if (!canvas) {
      setStatus('canvas #ctc-canvas nu a fost găsit în DOM', false);
      return;
    }
    if (!navigator.gpu) {
      setStatus('navigator.gpu lipsește — browserul ăsta nu expune WebGPU (verifică https://shaders.com/check)', false);
      return; // fără WebGPU, rămâne fundalul CSS static
    }

    let createShader;
    try {
      ({ createShader } = await import('https://esm.sh/shaders/js'));
    } catch (err) {
      setStatus('import din esm.sh a eșuat: ' + err.message, false);
      console.error('[cursor-trail-contact] import error', err);
      return;
    }

    try {
      shader = await createShader(canvas, {
      components: [
        {
          type: 'DotGrid',
          props: {
            id: 'trailDots',
            density: 40,
            dotSize: {
              type: 'map',
              source: 'trailFlow',
              channel: 'alpha',
              inputMin: 0,
              inputMax: 1,
              outputMin: 0,
              outputMax: 1,
            },
            twinkle: 0.9,
            visible: false,
          },
        },
        {
          type: 'ChromaFlow',
          props: {
            id: 'trailFlow',
            intensity: 1.4,
            radius: 2.9,
            visible: false,
          },
        },
        {
          type: 'LinearGradient',
          props: {
            colorA: '#1e1e1f',
            colorB: '#070708',
            colorSpace: 'hsl',
            start: { x: 0, y: 1 },
            end: { x: 1, y: 0 },
          },
        },
        {
          type: 'LinearGradient',
          props: {
            colorA: '#000000',
            colorB: '#ffffff',
            colorSpace: 'hsl',
            start: { x: 0, y: 1 },
            end: { x: 1, y: 0 },
            maskSource: 'trailDots',
          },
        },
        { type: 'CursorRipples', props: {} },
        { type: 'FilmGrain', props: { strength: 0.1 } },
        ],
      });
      setStatus('activ ✓ (mișcă cursorul peste secțiune)', true);
    } catch (err) {
      setStatus('createShader a eșuat: ' + err.message, false);
      console.error('[cursor-trail-contact] createShader error', err);
    }
  }

  function resizeShader() {
    shader?.resize();
  }

  initShader();
  window.addEventListener('resize', resizeShader);

  // La navigare (SPA) sau înainte de a scoate secțiunea din DOM:
  //   shader?.destroy();
</script>
<!-- SECTION END -->

</body>
</html>
