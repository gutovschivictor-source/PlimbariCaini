<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Pagina nu a fost găsită | Plimbări Câini Chișinău</title>
<link rel="icon" href="logo-câine.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #ffad69;
  --orange-dark: #e8924a;
  --orange-deep: #c97435;
  --brown: #5c3a1e;
  --cream: #fdf6ef;
  --white: #ffffff;
  --black: #1a0f08;
  --gray: #6b5a4e;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--brown);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}

.error-number {
  font-family: 'Playfair Display', serif;
  font-size: clamp(6rem, 20vw, 12rem);
  font-weight: 700;
  line-height: 1.5;
  color: var(--orange);
  opacity: 0.25;
  user-select: none;
  letter-spacing: -0.02em;
}

.paw {
  font-size: 3rem;
  margin: 0.5rem 0;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  color: var(--black);
  margin-bottom: 0.75rem;
}

p {
  font-size: 1rem;
  color: var(--gray);
  font-weight: 300;
  max-width: 340px;
  line-height: 1.7;
  margin-bottom: 2.5rem;
}

.buttons {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-primary {
  background: var(--orange);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.7rem 1.5rem;
  border-radius: 50px;
  text-decoration: none;
  transition: background 0.25s, transform 0.2s;
  box-shadow: 0 4px 16px rgba(255,173,105,0.35);
}
.btn-primary:hover {
  background: var(--orange-dark);
  transform: translateY(-2px);
}

.btn-secondary {
  background: transparent;
  color: var(--brown);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.7rem 1.5rem;
  border-radius: 50px;
  text-decoration: none;
  border: 1.5px solid rgba(92,58,30,0.2);
  transition: border-color 0.25s, color 0.25s, transform 0.2s;
}
.btn-secondary:hover {
  border-color: var(--orange);
  color: var(--orange-deep);
  transform: translateY(-2px);
}

.footer-copy {
  position: fixed;
  bottom: 1.5rem;
  color: rgba(92,58,30,0.3);
  font-size: 0.75rem;
}
</style>
</head>
<body>

<div class="error-number">404</div>
<div class="paw"></div>
<h1>Pagina nu a fost găsită</h1>
<p>Poate câinele a luat-o la plimbare. Întoarce-te acasă sau rezervă o plimbare.</p>

<div class="buttons">
  <a href="index.html" class="btn-primary">Acasă</a>
  <a href="index.html#contact" class="btn-secondary">Rezervă acum</a>
  <a href="index.html#services" class="btn-secondary">Servicii</a>
</div>

<div class="footer-copy">© 2026 Victor Gutovschi · Chișinău</div>

</body>
</html>
